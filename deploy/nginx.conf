# The site is proxied by Cloudflare, so $remote_addr is a Cloudflare edge.
# Restore the visitor's address from CF-Connecting-IP, trusting the header
# only when the request really comes from Cloudflare (a direct hit on the
# origin can't forge it). Ranges from https://www.cloudflare.com/ips
# (fetched 2026-10-04); refresh them if Cloudflare adds any.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Coarse flood guard per visitor for the API. The backend applies the real
# per-endpoint limits and budgets; this only stops request floods early.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name diveroast.app www.diveroast.app;
    client_max_body_size 50M;  # must match HTTPS block or large uploads 413 before redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name diveroast.app www.diveroast.app;

    # Cloudflare Origin Certificate (15-year, free from Cloudflare dashboard)
    # Place files at /etc/ssl/cloudflare/ on the host before first deploy
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 50M;

    # API → FastAPI backend
    location /api/ {
        limit_req          zone=api burst=40 nodelay;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming (chat responses) — disable buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Frontend → React SPA (served by nginx:alpine inside the frontend container)
    location / {
        proxy_pass       http://frontend:3000;
        proxy_set_header Host $host;
    }
}

# Second site on this server: Dive Diversity (divediversity.app), a separate
# compose project that joins the shared `web` network. The upstream is a
# variable so nginx resolves it per request and still starts when that
# container is down (a fixed name would fail the whole config).
server {
    listen 80;
    server_name divediversity.app www.divediversity.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name divediversity.app www.divediversity.app;

    ssl_certificate     /etc/ssl/cloudflare/divediversity.app.pem;
    ssl_certificate_key /etc/ssl/cloudflare/divediversity.app.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;

    resolver 127.0.0.11 valid=30s;
    set $divediversity http://divediversity-app-1:8080;

    location / {
        proxy_pass         $divediversity;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
