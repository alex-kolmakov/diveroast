# HTTP → HTTPS redirect
server {
    listen 80;
    server_name diveroast.app www.diveroast.app;
    client_max_body_size 50M;  # must match HTTPS block or large uploads 413 before redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name diveroast.app www.diveroast.app;

    # Cloudflare Origin Certificate (15-year, free from Cloudflare dashboard)
    # Place files at /etc/ssl/cloudflare/ on the host before first deploy
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 50M;

    # API → FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming (chat responses) — disable buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Frontend → React SPA (served by nginx:alpine inside the frontend container)
    location / {
        proxy_pass       http://frontend:3000;
        proxy_set_header Host $host;
    }
}
