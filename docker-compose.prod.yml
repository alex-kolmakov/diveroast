services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diveroast-backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_CLIENT_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # The backend is reachable only through nginx, which sets X-Real-IP
      # to the visitor's address (restored from Cloudflare's header).
      - TRUST_PROXY_HEADERS=true
    depends_on:
      phoenix:
        condition: service_healthy
    volumes:
      - ./.lancedb:/app/.lancedb
      - ./.dlt:/app/.dlt
      - diveroast-snapshots:/tmp/diveroast-snapshots
      - diveroast-donations:/tmp/diveroast-donations
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin API calls through the nginx proxy above
        VITE_API_URL: ""
    container_name: diveroast-frontend
    depends_on:
      - backend
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-20.16.0  # pinned; was :latest
    container_name: diveroast-phoenix
    # Published on the VPS loopback only, NOT exposed externally. Without a
    # published port the SSH tunnel had nothing to reach. Access via:
    #   ssh -L 6006:localhost:6006 root@<vps-ip>
    ports:
      - "127.0.0.1:6006:6006"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  diveroast-snapshots:
  diveroast-donations:
