# Docker keeps container logs forever by default; cap each service at
# 5 x 20 MB so a busy day can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# The server also runs other things. No container gets more than it started
# with: no privilege gain through setuid binaries, no Linux capabilities
# beyond the few a service names, and a cap on processes.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 512

services:
  nginx:
    logging: *logging
    <<: *hardening
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    mem_limit: 128m
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    # `web` is shared with other sites on this server that this nginx also
    # serves (see the second server block in deploy/nginx.conf).
    networks: [default, web]

  backend:
    logging: *logging
    <<: *hardening
    # A roast peaks near 1.5 GB (torch, two models, a dozen reranked searches)
    mem_limit: 2g
    cpus: 1.5
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diveroast-backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_CLIENT_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # The backend is reachable only through nginx, which sets X-Real-IP
      # to the visitor's address (restored from Cloudflare's header).
      - TRUST_PROXY_HEADERS=true
    depends_on:
      phoenix:
        condition: service_healthy
    volumes:
      - ./.lancedb:/app/.lancedb
      - ./.dlt:/app/.dlt
      - diveroast-snapshots:/tmp/diveroast-snapshots
      - diveroast-donations:/tmp/diveroast-donations
      # Today's token count: without it every restart reset the daily budget.
      - diveroast-state:/tmp/diveroast-state
    healthcheck:
      # /health fails on a missing or partial DAN index and a nearly full disk
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    logging: *logging
    <<: *hardening
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    mem_limit: 128m
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin API calls through the nginx proxy above
        VITE_API_URL: ""
        # Frontend Sentry project; empty = no error reports. From .env.
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
    container_name: diveroast-frontend
    depends_on:
      - backend
    restart: unless-stopped

  phoenix:
    logging: *logging
    <<: *hardening
    mem_limit: 1g
    image: arizephoenix/phoenix:version-20.16.0  # pinned; was :latest
    environment:
      # Traces hold every visitor's dive summary and messages: keep 30 days
      # (Phoenix's cleanup runs weekly, so up to 37). Applies when Phoenix
      # creates its database; change an existing one under Settings in the UI.
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=30
    volumes:
      # Without a volume the traces lived in the container and vanished on
      # every recreate.
      - phoenix-data:/root/.phoenix
    container_name: diveroast-phoenix
    # Published on the VPS loopback only, NOT exposed externally. Without a
    # published port the SSH tunnel had nothing to reach. Access via:
    #   ssh -L 6006:localhost:6006 root@<vps-ip>
    ports:
      - "127.0.0.1:6006:6006"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  diveroast-snapshots:
  diveroast-donations:
  diveroast-state:
  phoenix-data:

networks:
  # Created once on the server: docker network create web
  web:
    external: true
